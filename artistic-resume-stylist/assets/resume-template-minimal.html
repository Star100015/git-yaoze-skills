<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艺术风格简历 · {STYLE}</title>
<style>
:root{
  /* 以下令牌由 design tokens 注入，渲染时整体替换为目标风格的值 */
  --bg:#1b1d22;
  --surface:#26292f;
  --accent:#c0a062;
  --text:#eceff3;
  --muted:#9aa0a8;
  --border:rgba(200,205,215,.25);
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --texture:linear-gradient(135deg, rgba(255,255,255,.06), rgba(0,0,0,.15));
  --font-display:'Cinzel','Songti SC',serif;
  --font-body:'Helvetica Neue','PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  padding:40px 16px;
  background-image:var(--texture);
  background-attachment:fixed;
}
.page{
  max-width:820px;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:14px;
  padding:48px 56px;
}
header.hero{
  border-bottom:2px solid var(--accent);
  padding-bottom:24px;
  margin-bottom:32px;
}
.name{
  font-family:var(--font-display);
  font-size:40px;
  letter-spacing:2px;
  color:var(--text);
}
.role{
  color:var(--accent);
  font-size:18px;
  letter-spacing:3px;
  margin-top:6px;
}
.contact{
  color:var(--muted);
  font-size:14px;
  margin-top:12px;
}
.section{margin-bottom:28px;}
.section h2{
  font-family:var(--font-display);
  color:var(--accent);
  font-size:20px;
  letter-spacing:2px;
  margin-bottom:12px;
  border-left:4px solid var(--accent);
  padding-left:12px;
}
.item{margin-bottom:16px;}
.item .title{font-weight:600;color:var(--text);}
.item .meta{color:var(--muted);font-size:13px;margin:2px 0 6px;}
.item .desc{color:var(--muted);font-size:14px;}
.skills{display:flex;flex-wrap:wrap;gap:10px;}
.skill{
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
}
footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:32px;
  border-top:1px solid var(--border);
  padding-top:16px;
}
@media print{
  body{background:var(--surface);padding:0;}
  .page{box-shadow:none;border:none;max-width:none;}
}
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="name">{姓名}</div>
      <div class="role">{目标职位}</div>
      <div class="contact">{邮箱} · {电话} · {城市} · {个人主页}</div>
    </header>

    <section class="section">
      <h2>个人简介</h2>
      <p class="desc">{用 2-3 句话概括你的核心优势与职业定位。}</p>
    </section>

    <section class="section">
      <h2>工作经历</h2>
      <div class="item">
        <div class="title">{职位名称}</div>
        <div class="meta">{公司} · {起止时间} · {城市}</div>
        <div class="desc">{职责与成果，尽量用量化指标。}</div>
      </div>
      <!-- 复制 .item 增加更多经历 -->
    </section>

    <section class="section">
      <h2>项目经历</h2>
      <div class="item">
        <div class="title">{项目名称}</div>
        <div class="meta">{角色} · {时间}</div>
        <div class="desc">{项目描述与你的贡献。}</div>
      </div>
    </section>

    <section class="section">
      <h2>专业技能</h2>
      <div class="skills">
        <span class="skill">{技能1}</span>
        <span class="skill">{技能2}</span>
        <!-- 增加更多 .skill -->
      </div>
    </section>

    <section class="section">
      <h2>教育背景</h2>
      <div class="item">
        <div class="title">{学校}</div>
        <div class="meta">{专业 / 学位} · {起止时间}</div>
        <div class="desc">{相关课程或荣誉（可选）。}</div>
      </div>
    </section>

    <footer>本简历由「艺术风格简历生成助手」以 {风格名称} 风格生成 · 仅供预览与投递草稿</footer>
  </div>
</body>
</html>
